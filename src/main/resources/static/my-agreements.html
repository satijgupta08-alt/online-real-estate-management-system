```
<div class="navbar">
    <h2>Tenant - My Agreements</h2>
</div>

<div class="container">

    <a href="/tenant-dashboard.html" class="back-button">
        Back to Dashboard
    </a>

    <h2>My Rental Agreements</h2>

    <div id="message">
        Loading agreements...
    </div>

    <div id="agreementList" class="agreement-list"></div>

</div>

<script>

    async function loadAgreements() {

        const message = document.getElementById("message");
        const agreementList =
            document.getElementById("agreementList");

        const tenantEmail = prompt(
            "Enter your email to view your agreements:"
        );

        if (!tenantEmail) {
            message.innerText = "Email is required.";
            return;
        }

        try {

            const response =
                await fetch("/api/agreements");

            if (!response.ok) {
                throw new Error("Failed to load agreements");
            }

            const agreements =
                await response.json();

            const myAgreements =
                agreements.filter(
                    agreement =>
                        agreement.tenantEmail &&
                        agreement.tenantEmail.toLowerCase()
                        === tenantEmail.toLowerCase()
                );

            agreementList.innerHTML = "";

            if (myAgreements.length === 0) {

                message.innerText =
                    "No rental agreements found for this email.";

                return;
            }

            message.innerText =
                myAgreements.length +
                " rental agreement(s) found.";

            myAgreements.forEach(agreement => {

                const card =
                    document.createElement("div");

                card.className = "card";

                card.innerHTML = `
                    <h3>Agreement #${agreement.id}</h3>

                    <p>
                        <strong>Property ID:</strong>
                        ${agreement.propertyId}
                    </p>

                    <p>
                        <strong>Tenant Email:</strong>
                        ${agreement.tenantEmail}
                    </p>

                    <p>
                        <strong>Start Date:</strong>
                        ${agreement.startDate}
                    </p>

                    <p>
                        <strong>End Date:</strong>
                        ${agreement.endDate}
                    </p>

                    <p>
                        <strong>Monthly Rent:</strong>
                        ₹${agreement.monthlyRent}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status">
                            ${agreement.status}
                        </span>
                    </p>
                `;

                agreementList.appendChild(card);
            });

        } catch (error) {

            console.error(error);

            message.innerText =
                "Unable to load rental agreements.";
        }
    }

    loadAgreements();

</script>
