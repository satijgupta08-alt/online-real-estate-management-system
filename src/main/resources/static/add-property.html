<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fa;
        }

        .navbar {
            background: #1f4e79;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Property Manager - Add Property</h2>
    </div>

    <div class="container">

        <h2>Add New Property</h2>

        <form id="propertyForm">

            <label for="title">Property Title</label>
            <input type="text" id="title" placeholder="Enter property title" required>

            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter property address" required>

            <label for="city">City</label>
            <input type="text" id="city" placeholder="Enter city" required>

            <label for="price">Rent Price</label>
            <input type="number" id="price" placeholder="Enter rent price" required>

            <label for="propertyType">Property Type</label>
            <select id="propertyType" required>
                <option value="">-- Select Property Type --</option>
                <option value="Apartment">Apartment</option>
                <option value="House">House</option>
                <option value="Villa">Villa</option>
                <option value="Room">Room</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description"
                placeholder="Enter property description"
                required></textarea>

            <label for="available">Availability</label>
            <select id="available" required>
                <option value="true">Available</option>
                <option value="false">Not Available</option>
            </select>

            <button type="submit">Add Property</button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        document.getElementById("propertyForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const property = {

                title: document.getElementById("title").value,

                address: document.getElementById("address").value,

                city: document.getElementById("city").value,

                price: Number(document.getElementById("price").value),

                description: document.getElementById("description").value,

                propertyType: document.getElementById("propertyType").value,

                available: document.getElementById("available").value === "true"

            };

            const message = document.getElementById("message");

            try {

                const response = await fetch("/api/properties", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(property)

                });

                const data = await response.text();

                if (response.ok) {

                    message.style.color = "green";

                    message.innerText =
                        "Property added successfully!";

                    document.getElementById("propertyForm").reset();

                } else {

                    message.style.color = "red";

                    message.innerText =
                        data || "Failed to add property.";

                }

            } catch (error) {

                console.error(error);

                message.style.color = "red";

                message.innerText =
                    "Server error. Please try again.";

            }

        });

    </script>

</body>

</html>
